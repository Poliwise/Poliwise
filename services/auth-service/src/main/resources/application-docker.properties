# ===========================================
# Docker Profile Configuration (Docker Compose)
# ===========================================

# Bootstrap admin
poliwise.bootstrap.admin.enabled=${ADMIN_BOOTSTRAP_ENABLED:true}

# Database
spring.datasource.url=jdbc:postgresql://postgres:5432/poliwise?schema=core&sslmode=disable
spring.datasource.username=poliwise
spring.datasource.password=poliwise_secure_password
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA/Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

# RabbitMQ
spring.rabbitmq.host=rabbitmq
spring.rabbitmq.port=5672
spring.rabbitmq.username=poliwise
spring.rabbitmq.password=poliwise_secure_password
spring.rabbitmq.virtual-host=/

# Services
app.services.feedback-service-url=http://feedback-service:8085

# Actuator
management.health.rabbitmq.enabled=true
