# ===========================================
# Cloud Profile Configuration (Production)
# ===========================================

# Database (Supabase/PostgreSQL)
spring.datasource.url=${CLOUD_DB_URL:jdbc:postgresql://aws-1-ap-southeast-2.pooler.supabase.com:5432/postgres?schema=core&pgbouncer=true}
spring.datasource.username=${CLOUD_DB_USERNAME:postgres.yokxvdwwmibopyauwocp}
spring.datasource.password=${CLOUD_DB_PASSWORD:replace-with-cloud-db-password}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.connection-timeout=20000

# JPA/Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=false

# RabbitMQ (CloudAMQP)
spring.rabbitmq.host=${CLOUD_RABBITMQ_HOST:replace-with-cloudamqp-host}
spring.rabbitmq.port=${CLOUD_RABBITMQ_PORT:5672}
spring.rabbitmq.username=${CLOUD_RABBITMQ_USERNAME:replace-with-cloudamqp-username}
spring.rabbitmq.password=${CLOUD_RABBITMQ_PASSWORD:replace-with-cloudamqp-password}
spring.rabbitmq.virtual-host=${CLOUD_RABBITMQ_VHOST:replace-with-cloudamqp-vhost}

# Actuator
management.health.rabbitmq.enabled=true
