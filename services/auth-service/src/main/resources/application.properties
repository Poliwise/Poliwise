spring.application.name=auth-service

# Active profile (local or cloud)
# This is controlled by SPRING_PROFILES_ACTIVE environment variable
# Default: local (for Docker Compose development)
spring.profiles.active=${SPRING_PROFILES_ACTIVE:local}

# JWT
auth.jwt.secret=${AUTH_JWT_SECRET:replace-this-with-at-least-32-characters-secret-key}
auth.jwt.issuer=${AUTH_JWT_ISSUER:poliwise-auth-service}
auth.jwt.access-token-ttl=${AUTH_ACCESS_TOKEN_TTL:PT15M}

# Refresh token
auth.refresh-token.ttl=${AUTH_REFRESH_TOKEN_TTL:P7D}

# Login security
auth.login.max-failed-attempts=${AUTH_MAX_FAILED_ATTEMPTS:5}
auth.login.lock-duration=${AUTH_LOCK_DURATION:PT15M}

# Password reset
auth.password-reset.ttl=${AUTH_PASSWORD_RESET_TTL:PT30M}
auth.password-reset.frontend-url=${AUTH_PASSWORD_RESET_FRONTEND_URL:http://localhost:3000/reset-password}
