# ===========================================
# Local Profile Configuration (Docker Compose)
# ===========================================

# Database
spring.datasource.url=jdbc:postgresql://postgres:5432/poliwise?schema=core&sslmode=disable
spring.datasource.username=${LOCAL_DB_USERNAME:poliwise}
spring.datasource.password=${LOCAL_DB_PASSWORD:poliwise_secure_password}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA/Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

# RabbitMQ
spring.rabbitmq.host=${LOCAL_RABBITMQ_HOST:rabbitmq}
spring.rabbitmq.port=${LOCAL_RABBITMQ_PORT:5672}
spring.rabbitmq.username=${LOCAL_RABBITMQ_USERNAME:poliwise}
spring.rabbitmq.password=${LOCAL_RABBITMQ_PASSWORD:poliwise_secure_password}
spring.rabbitmq.virtual-host=${LOCAL_RABBITMQ_VHOST:/}

# Actuator
management.health.rabbitmq.enabled=true
