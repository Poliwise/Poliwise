spring.application.name=knowledge-service

# JWT Configuration
poliwise.jwt.secret=${AUTH_JWT_SECRET:change-me-in-production}
poliwise.jwt.issuer=${AUTH_JWT_ISSUER:poliwise-auth-service}

# MinIO Configuration
minio.endpoint=${MINIO_ENDPOINT:http://localhost:9000}
minio.access-key=${MINIO_ACCESS_KEY:minioadmin}
minio.secret-key=${MINIO_SECRET_KEY:minioadmin}
minio.bucket-name=${MINIO_BUCKET:poliwise-documents}

# Knowledge Processing Configuration
knowledge.chunking.default-strategy=RECURSIVE
knowledge.chunking.default-chunk-size=1000
knowledge.chunking.default-overlap=200
knowledge.embedding.default-model=TEXT_EMBEDDING_3_SMALL
knowledge.embedding.api-url=${EMBEDDING_API_URL:https://api.openai.com/v1/embeddings}
knowledge.embedding.api-key=${EMBEDDING_API_KEY:}
knowledge.embedding.batch-size=100
knowledge.file-validation.max-file-size-bytes=52428800
knowledge.processing.max-retries=3
knowledge.processing.retry-delay-seconds=30

# Ingestion Service (Phase 1: Metadata Suggestion)
knowledge.ingestion.api-url=${INGESTION_SERVICE_URL:http://localhost:8088}
knowledge.ingestion.suggestion-timeout-seconds=5

# Metadata Service (Phase 1: Category/Tag Context)
knowledge.metadata.api-url=${METADATA_SERVICE_URL:http://localhost:8085}

# Database
spring.datasource.url=${KNOWLEDGE_DATASOURCE_URL:jdbc:postgresql://localhost:5432/postgres?schema=knowledge}
spring.datasource.username=${KNOWLEDGE_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${KNOWLEDGE_DATASOURCE_PASSWORD:postgres}

# RabbitMQ
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USERNAME:guest}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:guest}
spring.rabbitmq.virtual-host=${RABBITMQ_VHOST:/}

# Actuator
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always

# Logging
logging.level.com.poliwise.knowledge=DEBUG
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n