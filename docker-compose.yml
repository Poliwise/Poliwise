services:
  # ============================================================
  # Infrastructure
  # ============================================================

  postgres:
    image: pgvector/pgvector:pg16
    container_name: poliwise-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: poliwise
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-poliwise_secure_password}
      POSTGRES_DB: poliwise
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infrastructure/init-db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - ./docs/supbase_sql:/docker-entrypoint-initdb.d/supbase_sql:ro
      - ./docs/supbase_sql_update_v1:/docker-entrypoint-initdb.d/supbase_sql_update_v1:ro
      - ./infrastructure/init-db/supbase_sql_update_v2:/docker-entrypoint-initdb.d/supbase_sql_update_v2:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U poliwise" ]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1G
        reservations:
          memory: 512M
    networks:
      - poliwise

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: poliwise-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: poliwise
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-poliwise_secure_password}
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: [ "CMD", "rabbitmq-diagnostics", "check_running" ]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M
        reservations:
          memory: 256M
    networks:
      - poliwise

  minio:
    image: minio/minio:latest
    container_name: poliwise-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    volumes:
      - minio_data:/data
    ports:
      - "9000:9000"
      - "9001:9001"
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:9000/minio/health/live" ]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M
        reservations:
          memory: 256M
    networks:
      - poliwise

  # ============================================================
  # Microservices
  # ============================================================

  auth-service:
    build:
      context: ./services/auth-service
      dockerfile: Dockerfile
    container_name: poliwise-auth-service
    restart: unless-stopped
    env_file:
      - ./services/auth-service/.env
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SERVER_PORT: 8081
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/poliwise?schema=core
      SPRING_DATASOURCE_USERNAME: poliwise
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-poliwise_secure_password}
      SPRING_CLOUD_COMPATIBILITY_VERIFIER_ENABLED: "false"
      AUTH_JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
      AUTH_JWT_ISSUER: poliwise-auth-service
      AUTH_ACCESS_TOKEN_TTL: PT15M
      AUTH_REFRESH_TOKEN_TTL: P7D
      AUTH_MAX_FAILED_ATTEMPTS: 5
      AUTH_LOCK_DURATION: PT15M
      ADMIN_USERNAME: admin
      ADMIN_EMAIL: admin@poliwise.com
      ADMIN_PASSWORD: Admin@123456
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_PORT: 5672
      SPRING_RABBITMQ_USERNAME: poliwise
      SPRING_RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-poliwise_secure_password}
      EMAIL_USERNAME: ${EMAIL_USERNAME:-xuanvietle20050228@gmail.com}
      EMAIL_APP_PASSWORD: ${EMAIL_APP_PASSWORD:-mjhclmhmzwxhowpi}
      EMAIL_FROM_NAME: ${EMAIL_FROM_NAME:-Poliwise Support}
      EMAIL_FROM_ADDRESS: ${EMAIL_FROM_ADDRESS:-support@poliwise.com}
      EMAIL_ENABLED: ${EMAIL_ENABLED:-true}
      JAVA_OPTS: "-Xmx512m -Xms256m"
    ports:
      - "8081:8081"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: [ "CMD-SHELL", "curl -f http://localhost:8081/actuator/health" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 768M
    networks:
      - poliwise

  user-service:
    build:
      context: ./services/user-service
      dockerfile: Dockerfile
    container_name: poliwise-user-service
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SERVER_PORT: 8082
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/poliwise
      SPRING_DATASOURCE_USERNAME: poliwise
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-poliwise_secure_password}
      POLIWISE_JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
      POLIWISE_JWT_ISSUER: poliwise-auth-service
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_PORT: 5672
      SPRING_RABBITMQ_USERNAME: poliwise
      SPRING_RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-poliwise_secure_password}
      JAVA_OPTS: "-Xmx512m -Xms256m"
    ports:
      - "8082:8082"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      auth-service:
        condition: service_healthy
    healthcheck:
      test: [ "CMD-SHELL", "curl -f http://localhost:8082/actuator/health" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 768M
    networks:
      - poliwise

  knowledge-service:
    build:
      context: ./services/knowledge-service
      dockerfile: Dockerfile
    container_name: poliwise-knowledge-service
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SERVER_PORT: 8083
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/poliwise?schema=knowledge
      SPRING_DATASOURCE_USERNAME: poliwise
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-poliwise_secure_password}
      POLIWISE_JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
      MINIO_BUCKET_NAME: ${MINIO_BUCKET_NAME:-poliwise-documents}
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_PORT: 5672
      SPRING_RABBITMQ_USERNAME: poliwise
      SPRING_RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-poliwise_secure_password}
      INGESTION_SERVICE_URL: http://ingestion-service:8088
      METADATA_SERVICE_URL: http://metadata-service:8084
      JAVA_OPTS: "-Xmx512m -Xms256m"
    ports:
      - "8083:8083"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: [ "CMD-SHELL", "curl -f http://localhost:8083/actuator/health" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 768M
    networks:
      - poliwise

  metadata-service:
    build:
      context: ./services/metadata-service
      dockerfile: Dockerfile
    container_name: poliwise-metadata-service
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SERVER_PORT: 8084
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/poliwise?schema=metadata
      SPRING_DATASOURCE_USERNAME: poliwise
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-poliwise_secure_password}
      POLIWISE_JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
      POLIWISE_JWT_ISSUER: poliwise-auth-service
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_PORT: 5672
      SPRING_RABBITMQ_USERNAME: poliwise
      SPRING_RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-poliwise_secure_password}
      JAVA_OPTS: "-Xmx512m -Xms256m"
    ports:
      - "8084:8084"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: [ "CMD-SHELL", "curl -f http://localhost:8084/actuator/health" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 768M
    networks:
      - poliwise

  feedback-service:
    build:
      context: ./services/feedback-service
      dockerfile: Dockerfile
    container_name: poliwise-feedback-service
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SERVER_PORT: 8085
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/poliwise?schema=analytics
      SPRING_DATASOURCE_USERNAME: poliwise
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-poliwise_secure_password}
      POLIWISE_JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_PORT: 5672
      SPRING_RABBITMQ_USERNAME: poliwise
      SPRING_RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-poliwise_secure_password}
      SPRING_RABBITMQ_VIRTUAL_HOST: /
      JAVA_OPTS: "-Xmx512m -Xms256m"
    ports:
      - "8085:8085"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: [ "CMD-SHELL", "curl -f http://localhost:8085/actuator/health" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 768M
    networks:
      - poliwise

  # ============================================================
  # AI Processing Layer
  # ============================================================
  # Mode A (stable): AI Python services are disabled because source
  # folders are not present in this repository snapshot.

  # ============================================================
  # Document Ingestion Service
  # ============================================================

  ingestion-service:
    build:
      context: ./services/ingestion-service
      dockerfile: Dockerfile
    container_name: poliwise-ingestion-service
    restart: unless-stopped
    environment:
      HOST: 0.0.0.0
      PORT: 8088
      LOG_LEVEL: info
      DATABASE_URL: postgresql+asyncpg://poliwise:${POSTGRES_PASSWORD:-poliwise_secure_password}@postgres:5432/poliwise
      DATABASE_SCHEMA: knowledge
      RABBITMQ_URL: amqp://poliwise:${RABBITMQ_PASSWORD:-poliwise_secure_password}@rabbitmq:5672
      RABBITMQ_EXCHANGE: poliwise.events
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
      MINIO_SECURE: "false"
      EMBEDDING_URL: http://bge-m3-embedding:80
      RERANKER_URL: ${RERANKER_URL:-http://host.docker.internal:8002}
      GROQ_API_KEY: ${GROQ_API_KEY}
      GROQ_MODEL: ${GROQ_MODEL:-llama-3.3-70b-versatile}
    ports:
      - "8088:8088"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      minio:
        condition: service_healthy
      bge-m3-embedding:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8088/health" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1G
        reservations:
          memory: 512M
    networks:
      - poliwise

  # ============================================================
  # AI Embedding Model (BGE-M3 via HuggingFace TEI)
  # ============================================================

  bge-m3-embedding:
    image: ghcr.io/huggingface/text-embeddings-inference:cpu-1.6
    container_name: poliwise-bge-m3
    restart: unless-stopped
    command: --model-id BAAI/bge-m3 --pooling cls
    volumes:
      - ./data/hf_cache:/data
    ports:
      - "8001:80"
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:80/health" ]
      interval: 30s
      timeout: 30s
      retries: 10
      start_period: 600s
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 4G
        reservations:
          memory: 2G
    networks:
      - poliwise

  # ============================================================
  # API Gateway
  # ============================================================

  api-gateway:
    build:
      context: ./services/api-gateway
      dockerfile: Dockerfile
    container_name: poliwise-api-gateway
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
      JWT_ISSUER: poliwise-auth-service
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:3000}
      AUTH_SERVICE_URL: ${AUTH_SERVICE_URL:-http://auth-service:8081}
      USER_SERVICE_URL: ${USER_SERVICE_URL:-http://user-service:8082}
      KNOWLEDGE_SERVICE_URL: ${KNOWLEDGE_SERVICE_URL:-http://knowledge-service:8083}
      METADATA_SERVICE_URL: ${METADATA_SERVICE_URL:-http://metadata-service:8084}
      FEEDBACK_SERVICE_URL: ${FEEDBACK_SERVICE_URL:-http://feedback-service:8085}
      AI_QA_SERVICE_URL: ${AI_QA_SERVICE_URL:-http://ai-qa-service:8086}
      INGESTION_SERVICE_URL: ${INGESTION_SERVICE_URL:-http://ingestion-service:8088}
      THROTTLE_TTL: 60000
      THROTTLE_LIMIT_USER: 100
      THROTTLE_LIMIT_MANAGER: 200
      THROTTLE_LIMIT_ADMIN: 500
      THROTTLE_LIMIT_PUBLIC: 200
      CIRCUIT_BREAKER_TIMEOUT: 30000
      CIRCUIT_BREAKER_VOLUME_THRESHOLD: 10
      LOG_LEVEL: info
    ports:
      - "3001:3000"
    depends_on:
      auth-service:
        condition: service_healthy
      user-service:
        condition: service_healthy
      knowledge-service:
        condition: service_healthy
      metadata-service:
        condition: service_healthy
      feedback-service:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "node", "-e", "fetch('http://localhost:3000/health').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))" ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M
    networks:
      - poliwise

  # ============================================================
  # Frontend
  # ============================================================

  frontend:
    build:
      context: ./frontend/web
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:3001}
    container_name: poliwise-frontend
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:3001}
    ports:
      - "3000:3000"
    depends_on:
      api-gateway:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3000" ]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M
    networks:
      - poliwise

networks:
  poliwise:
    name: poliwise-network
    driver: bridge

volumes:
  postgres_data:
  rabbitmq_data:
  minio_data:
