services:
  # ============================================================
  # Infrastructure
  # ============================================================

  postgres:
    image: pgvector/pgvector:pg16
    container_name: poliwise-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: poliwise
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-poliwise_secure_password}
      POSTGRES_DB: poliwise
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infrastructure/init-db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - ./docs/supbase_sql:/docker-entrypoint-initdb.d/supbase_sql:ro
      - ./docs/supbase_sql_update_v1:/docker-entrypoint-initdb.d/supbase_sql_update_v1:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U poliwise" ]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1G
        reservations:
          memory: 512M
    networks:
      - poliwise

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: poliwise-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: poliwise
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-poliwise_secure_password}
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: [ "CMD", "rabbitmq-diagnostics", "check_running" ]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M
        reservations:
          memory: 256M
    networks:
      - poliwise

  minio:
    image: minio/minio:latest
    container_name: poliwise-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    volumes:
      - minio_data:/data
    ports:
      - "9000:9000"
      - "9001:9001"
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:9000/minio/health/live" ]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M
        reservations:
          memory: 256M
    networks:
      - poliwise

  # ============================================================
  # Microservices
  # ============================================================

  auth-service:
    build:
      context: ./services/auth-service
      dockerfile: Dockerfile
    container_name: poliwise-auth-service
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SERVER_PORT: 8081
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/poliwise?schema=core
      SPRING_DATASOURCE_USERNAME: poliwise
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-poliwise_secure_password}
      SPRING_CLOUD_COMPATIBILITY_VERIFIER_ENABLED: "false"
      AUTH_JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
      AUTH_JWT_ISSUER: poliwise-auth-service
      AUTH_ACCESS_TOKEN_TTL: PT15M
      AUTH_REFRESH_TOKEN_TTL: P7D
      AUTH_MAX_FAILED_ATTEMPTS: 5
      AUTH_LOCK_DURATION: PT15M
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_PORT: 5672
      SPRING_RABBITMQ_USERNAME: poliwise
      SPRING_RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-poliwise_secure_password}
      JAVA_OPTS: "-Xmx512m -Xms256m"
    ports:
      - "8081:8081"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: [ "CMD-SHELL", "curl -f http://localhost:8081/actuator/health" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 768M
    networks:
      - poliwise

  user-service:
    build:
      context: ./services/user-service
      dockerfile: Dockerfile
    container_name: poliwise-user-service
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SERVER_PORT: 8082
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/poliwise
      SPRING_DATASOURCE_USERNAME: poliwise
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-poliwise_secure_password}
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_PORT: 5672
      SPRING_RABBITMQ_USERNAME: poliwise
      SPRING_RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-poliwise_secure_password}
      JAVA_OPTS: "-Xmx512m -Xms256m"
    ports:
      - "8082:8082"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      auth-service:
        condition: service_healthy
    healthcheck:
      test: [ "CMD-SHELL", "curl -f http://localhost:8082/actuator/health" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 768M
    networks:
      - poliwise

  knowledge-service:
    build:
      context: ./services/knowledge-service
      dockerfile: Dockerfile
    container_name: poliwise-knowledge-service
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SERVER_PORT: 8083
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/poliwise?schema=knowledge
      SPRING_DATASOURCE_USERNAME: poliwise
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-poliwise_secure_password}
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
      MINIO_BUCKET_NAME: ${MINIO_BUCKET_NAME:-poliwise-documents}
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_PORT: 5672
      SPRING_RABBITMQ_USERNAME: poliwise
      SPRING_RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-poliwise_secure_password}
      JAVA_OPTS: "-Xmx512m -Xms256m"
    ports:
      - "8083:8083"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: [ "CMD-SHELL", "curl -f http://localhost:8083/actuator/health" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 768M
    networks:
      - poliwise

  metadata-service:
    build:
      context: ./services/metadata-service
      dockerfile: Dockerfile
    container_name: poliwise-metadata-service
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SERVER_PORT: 8084
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/poliwise?schema=metadata
      SPRING_DATASOURCE_USERNAME: poliwise
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-poliwise_secure_password}
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_PORT: 5672
      SPRING_RABBITMQ_USERNAME: poliwise
      SPRING_RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-poliwise_secure_password}
      JAVA_OPTS: "-Xmx512m -Xms256m"
    ports:
      - "8084:8084"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: [ "CMD-SHELL", "curl -f http://localhost:8084/actuator/health" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 768M
    networks:
      - poliwise

  feedback-service:
    build:
      context: ./services/feedback-service
      dockerfile: Dockerfile
    container_name: poliwise-feedback-service
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SERVER_PORT: 8085
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/poliwise?schema=analytics
      SPRING_DATASOURCE_USERNAME: poliwise
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-poliwise_secure_password}
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_PORT: 5672
      SPRING_RABBITMQ_USERNAME: poliwise
      SPRING_RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-poliwise_secure_password}
      JAVA_OPTS: "-Xmx512m -Xms256m"
      POLIWISE_JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
      POLIWISE_JWT_ISSUER: poliwise-auth-service
    ports:
      - "8085:8085"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: [ "CMD-SHELL", "curl -f http://localhost:8085/actuator/health" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 768M
    networks:
      - poliwise

  # ============================================================
  # AI Processing Layer
  # ============================================================
  # Mode A (stable): AI Python services are disabled because source
  # folders are not present in this repository snapshot.

  # ============================================================
  # API Gateway
  # ============================================================

  api-gateway:
    build:
      context: ./services/api-gateway
      dockerfile: Dockerfile
    container_name: poliwise-api-gateway
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
      CORS_ORIGIN: http://localhost:3001
      AUTH_SERVICE_URL: http://auth-service:8081
      USER_SERVICE_URL: http://user-service:8082
      KNOWLEDGE_SERVICE_URL: http://knowledge-service:8083
      METADATA_SERVICE_URL: http://metadata-service:8084
      FEEDBACK_SERVICE_URL: http://feedback-service:8085
      THROTTLE_TTL: 60000
      THROTTLE_LIMIT_USER: 100
      THROTTLE_LIMIT_MANAGER: 200
      THROTTLE_LIMIT_ADMIN: 500
      THROTTLE_LIMIT_PUBLIC: 20
      CIRCUIT_BREAKER_TIMEOUT: 30000
      CIRCUIT_BREAKER_VOLUME_THRESHOLD: 10
      LOG_LEVEL: info
    ports:
      - "3000:3000"
    depends_on:
      auth-service:
        condition: service_healthy
      user-service:
        condition: service_healthy
      knowledge-service:
        condition: service_healthy
      metadata-service:
        condition: service_healthy
      feedback-service:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:3000/health').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M
    networks:
      - poliwise

  # ============================================================
  # Frontend
  # ============================================================

  frontend:
    build:
      context: ./frontend/web
      dockerfile: Dockerfile
    container_name: poliwise-frontend
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:3000}
    ports:
      - "3001:3001"
    depends_on:
      api-gateway:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3001" ]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M
    networks:
      - poliwise

networks:
  poliwise:
    name: poliwise-network
    driver: bridge

volumes:
  postgres_data:
  rabbitmq_data:
  minio_data:
